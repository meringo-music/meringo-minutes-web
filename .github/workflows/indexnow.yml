name: indexnow

# Tells the IndexNow engines (Bing and the others that share the protocol;
# Google is not one of them) that the site changed, once GitHub Pages has
# finished deploying main, so an engine that fetches straight away gets the
# new pages and not the old ones. The key file at the repo root proves the
# ping comes from this site. It sends nothing but the page URLs listed in
# sitemap.xml.

on:
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Submit the sitemap's URLs
        run: |
          KEY=$(basename "$(ls ./*.txt | grep -E '/[0-9a-f]{32}\.txt$')" .txt)
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | sed 's/.*/"&"/' | paste -sd, -)
          STATUS=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"meringominutes.app\",\"key\":\"$KEY\",\"keyLocation\":\"https://meringominutes.app/$KEY.txt\",\"urlList\":[$URLS]}" \
            https://api.indexnow.org/indexnow)
          echo "IndexNow answered HTTP $STATUS"
          if [ -s response.txt ]; then cat response.txt; echo; fi
          # 200: accepted. 202: accepted, and the key is still being checked.
          # Anything else (400 bad request, 403 key not valid, 422 URLs not
          # this host's, 429 too many requests) fails the job.
          case "$STATUS" in
            200|202) ;;
            *) exit 1 ;;
          esac
