<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'">
  <title>Open Graph image — Meringo Minutes</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/tools/og/og.css">
</head>
<body>
  <main class="card">
    <div class="copy">
      <p class="brand"><img src="/assets/img/app-icon-256.png" width="56" height="56" alt=""><span>Meringo Minutes</span></p>
      <h1>Meeting notes you can check against the recording.</h1>
      <p class="url">meringominutes.app</p>
    </div>
    <figure class="window">
      <div class="bar"><span class="lights"><i></i><i></i><i></i></span><span>Meringo Minutes</span></div>
      <div class="body">
        <p class="meeting">Weekly partners meeting</p>
        <p class="field">What day rate did the agency quote for the locum?</p>
        <p class="answer">I found nothing in this meeting that says that.</p>
      </div>
    </figure>
  </main>
</body>
</html>
